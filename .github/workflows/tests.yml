name: Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    name: pytest / ${{ matrix.os }} / Python ${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ['3.10', '3.13']
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install Qt's system libraries (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libegl1 libgl1 libopengl0 libxkbcommon-x11-0 libxcb-cursor0
      - name: Install project and test dependencies
        run: python -m pip install -e ".[dev]"
      - name: Fetch RevisionWorx, for the real-exchange tests
        shell: bash
        run: |
          git clone --depth 1 https://github.com/nrobertson152/RevisionWorx ../RevisionWorx
          python -m pip install -e ../RevisionWorx
      - name: Byte-compile
        run: python -m compileall -q openmeridian tests
      - name: Run pytest
        run: python -m pytest -q --tb=short -ra
      - name: Self-test
        run: python -m openmeridian --self-test
